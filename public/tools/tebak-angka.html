<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tebak Angka</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter','Segoe UI',sans-serif}
    .grad-text{background:linear-gradient(120deg,#c4b5fd,#a855f7 45%,#818cf8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    @keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
    .anim-in{animation:scaleIn .5s ease}
    .guess-msg{font-size:1.1rem;margin:1rem 0;min-height:2rem;color:#e8edf5;transition:all .3s}
    .guess-msg.correct{color:#a855f7;font-weight:700}
    .guess-msg.wrong{color:#ff6b6b}
    .guess-tag{padding:.2rem .5rem;border-radius:4px;font-size:.7rem;font-family:monospace}
    .guess-tag.low{background:rgba(100,150,255,.15);color:#6496ff}
    .guess-tag.high{background:rgba(255,107,107,.15);color:#ff6b6b}
    .guess-tag.correct{background:rgba(168,85,247,.15);color:#a855f7}
    .diff-btn{padding:.4rem .8rem;border-radius:6px;border:1px solid rgba(168,85,247,.2);background:transparent;color:#7a7899;font-size:.8rem;cursor:pointer;font-family:inherit;transition:all .3s}
    .diff-btn.active{background:#a855f7;color:#0a0a12;border-color:#a855f7}
    .diff-btn:hover:not(.active){border-color:#a855f7;color:#a855f7}
  </style>
</head>
<body class="min-h-screen bg-[#0a0a12] text-[#e8edf5] flex flex-col items-center justify-center px-6 py-8"
  style="background-image:radial-gradient(1200px 500px at 50% -100px,rgba(168,85,247,.12),transparent 60%),radial-gradient(900px 400px at 100% 100%,rgba(244,63,94,.07),transparent 55%)">

  <a href="../index.html" class="fixed top-6 left-6 text-[#c4b5fd] bg-white/5 hover:bg-purple-500/15 hover:text-white rounded-xl px-3 py-2 text-sm inline-flex items-center gap-2 transition-transform hover:-translate-x-0.5 z-10"><i class="fas fa-arrow-left"></i> Kembali ke Portofolio</a>

  <div class="w-full max-w-[440px] anim-in">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold grad-text">Tebak Angka</h1>
      <p class="text-[#ffffff66] text-sm mt-1">Uji keberuntunganmu!</p>
    </div>
    <div class="bg-[#14141f] rounded-2xl p-8 border border-purple-500/10 shadow-[0_4px_20px_rgba(0,0,0,.3)] text-center">
      <div class="flex gap-2 justify-center mb-6">
        <button class="diff-btn active" data-max="100">Mudah (1-100)</button>
        <button class="diff-btn" data-max="500">Sedang (1-500)</button>
        <button class="diff-btn" data-max="1000">Sulit (1-1000)</button>
      </div>
      <div class="relative my-6">
        <div class="w-full h-2 bg-[#0a0a12] rounded relative overflow-hidden">
          <div class="h-full bg-gradient-to-r from-purple-500 to-[#ff6b6b] rounded transition-all duration-300" id="gauge-fill"></div>
          <div class="absolute -top-1.5 w-1 h-5 bg-purple-500 rounded shadow-[0_0_8px_#a855f7] transition-all duration-300" id="gauge-marker"></div>
        </div>
        <div class="flex justify-between text-[11px] text-[#ffffff66] mt-2"><span id="gauge-min">1</span><span id="gauge-max">100</span></div>
      </div>
      <p class="guess-msg" id="guess-msg">Tebak angka antara 1-100!</p>
      <div class="my-6">
        <input type="number" class="guess-input w-full max-w-[200px] px-4 py-3 text-xl text-center rounded-xl border-2 border-purple-500/20 bg-[#0a0a12] text-purple-500 font-bold font-mono focus:outline-none focus:border-purple-500 transition-colors" id="guess-input" min="1" max="100" placeholder="?">
      </div>
      <div class="flex gap-4 justify-center mt-4">
        <button id="guess-btn" style="min-width:120px" class="rounded-lg px-4 py-2.5 font-semibold cursor-pointer bg-gradient-to-br from-indigo-500 to-purple-500 text-white shadow-[0_4px_15px_rgba(139,92,246,.3)] hover:brightness-110 hover:-translate-y-0.5 transition-all">Tebak!</button>
        <button id="guess-reset" style="min-width:120px" class="rounded-lg px-4 py-2.5 font-semibold cursor-pointer bg-[#1f1f2e] text-[#e8edf5] border border-purple-500/20 hover:bg-[#14141f] hover:text-purple-400 transition-all">Permainan Baru</button>
      </div>
      <div class="grid grid-cols-3 gap-3 mt-6">
        <div class="bg-[#0a0a12] rounded-xl p-3 border border-purple-500/10"><div class="text-xl font-bold text-purple-500" id="stat-attempts">0</div><div class="text-[11px] text-[#ffffff66] mt-0.5">Percobaan</div></div>
        <div class="bg-[#0a0a12] rounded-xl p-3 border border-purple-500/10"><div class="text-xl font-bold text-purple-500" id="stat-wins">0</div><div class="text-[11px] text-[#ffffff66] mt-0.5">Kemenangan</div></div>
        <div class="bg-[#0a0a12] rounded-xl p-3 border border-purple-500/10"><div class="text-xl font-bold text-purple-500" id="stat-streak">0</div><div class="text-[11px] text-[#ffffff66] mt-0.5">Streak</div></div>
      </div>
      <div class="mt-4 flex flex-wrap gap-1 justify-center" id="guess-history"></div>
    </div>
  </div>

  <script>
  (function(){
    let max=100,secret,attempts=0,wins=0,streak=0,history=[];
    const msg=document.getElementById('guess-msg');
    const input=document.getElementById('guess-input');
    const gauge=document.getElementById('gauge-fill');
    const marker=document.getElementById('gauge-marker');
    const gaugeMin=document.getElementById('gauge-min');
    const gaugeMax=document.getElementById('gauge-max');

    function newGame(){
      secret=Math.floor(Math.random()*max)+1;
      attempts=0;
      input.value='';
      input.max=max;
      input.disabled=false;
      msg.textContent='Tebak angka antara 1-'+max+'!';
      msg.className='guess-msg';
      history=[];
      updateStats();
      updateGauge(50);
      document.getElementById('guess-history').innerHTML='';
    }

    function updateStats(){
      document.getElementById('stat-attempts').textContent=attempts;
      document.getElementById('stat-wins').textContent=wins;
      document.getElementById('stat-streak').textContent=streak;
    }

    function updateGauge(pct){
      gauge.style.width=pct+'%';
      marker.style.left='calc('+pct+'% - 2px)';
    }

    function renderHistory(){
      const el=document.getElementById('guess-history');
      el.innerHTML=history.map(h=>{
        const cls=h.result==='correct'?'correct':h.guess<secret?'low':'high';
        return '<span class="guess-tag '+cls+'">'+h.guess+'</span>';
      }).join('');
    }

    document.getElementById('guess-btn').addEventListener('click',()=>{
      const g=parseInt(input.value);
      if(isNaN(g)||g<1||g>max){msg.textContent='Masukkan angka 1-'+max;msg.className='guess-msg wrong';return;}
      attempts++;
      const pct=Math.min(100,Math.max(0,(g/max)*100));
      if(g===secret){
        msg.textContent='Benar! Angka '+secret+' dalam '+attempts+' percobaan!';
        msg.className='guess-msg correct';
        wins++;streak++;
        history.push({guess:g,result:'correct'});
        input.disabled=true;
      }else if(g<secret){
        msg.textContent='Terlalu rendah! Coba lebih besar.';
        msg.className='guess-msg wrong';
        streak=0;
        history.push({guess:g,result:'low'});
        updateGauge(Math.min(95,(g/max)*100+5));
      }else{
        msg.textContent='Terlalu tinggi! Coba lebih kecil.';
        msg.className='guess-msg wrong';
        streak=0;
        history.push({guess:g,result:'high'});
        updateGauge(Math.max(5,(g/max)*100-5));
      }
      input.value='';
      updateStats();
      renderHistory();
    });

    input.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('guess-btn').click();});

    document.getElementById('guess-reset').addEventListener('click',newGame);

    document.querySelectorAll('.diff-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        max=parseInt(btn.dataset.max);
        gaugeMin.textContent='1';
        gaugeMax.textContent=max;
        newGame();
      });
    });

    newGame();
  })();
  </script>
</body>
</html>
